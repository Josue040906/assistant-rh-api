spring.application.name=assistant-rh-api
# En local, les secrets (JWT_SECRET...) viennent du fichier .env ; en ligne, des variables de l'hebergeur.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/assistant_rh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

security.jwt.secret=${JWT_SECRET:}
telephone.region-par-defaut=${TELEPHONE_REGION_PAR_DEFAUT:MG}
notifications.anciennete.cron=${NOTIFICATIONS_ANCIENNETE_CRON:0 0 8 * * *}
notifications.zone=${NOTIFICATIONS_ZONE:Indian/Antananarivo}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

server.port=${PORT:8080}
