spring.application.name=assistant-rh-api
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5433/assistant_rh
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

security.jwt.secret=${JWT_SECRET:}
telephone.region-par-defaut=${TELEPHONE_REGION_PAR_DEFAUT:MG}
notifications.anciennete.cron=${NOTIFICATIONS_ANCIENNETE_CRON:0 0 8 * * *}
notifications.zone=${NOTIFICATIONS_ZONE:Indian/Antananarivo}

# Encodage UTF-8 des rÃ©ponses HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.error.include-message=always
# Encodage HTTP sous Spring Boot 4
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force-response=true

# Afficher les messages d'erreur pendant le développement
spring.web.error.include-message=always